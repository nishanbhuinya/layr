<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>LAYR</title>
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161719" media="(prefers-color-scheme: dark)" />
    <meta property="og:site_name" content="LAYR" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://layr.dynshift.com/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="alternate" type="text/plain" href="/llms.txt" title="LAYR documentation for language models" />
    <script>
      // The reader's theme (a palette and its light or dark base), applied before first paint.
      try {
        var t = localStorage.getItem("layr-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        var p = JSON.parse(localStorage.getItem("layr-palette") || "null");
        if (p && p.css) {
          var s = document.createElement("style");
          s.id = "layr-palette";
          s.textContent = p.css;
          document.head.appendChild(s);
        }
      } catch (e) {}
    </script>
    %LAYR_HEAD%
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/lib/boot.ts"></script>
    <script type="module" src="/@layr/app"></script>
  </body>
</html>
