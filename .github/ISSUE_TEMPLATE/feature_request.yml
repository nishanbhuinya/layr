name: Feature request
description: Propose a change to the language, a widget, the CLI or the tools.
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Open-ended ideas fit [Discussions → Ideas](https://github.com/nishanbhuinya/layr/discussions/categories/ideas) better; a concrete proposal belongs here.
        LAYR aims to stay readable at a glance and deterministic on every screen. Proposals that keep it that way go furthest (see CONTRIBUTING.md).
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to build, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How it could look in LAYR
      description: The `.layr` you would like to write.
      render: layr
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I would like to open the pull request for this.
